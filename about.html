    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #fff;
      color: #333;
    }

    .team-section {
      text-align: center;
      padding: 60px 20px;
    }

    .team-section h2 {
      font-size: 36px;
      color: #083b84;
      margin-bottom: 10px;
    }

    .team-section p.subtitle {
      color: #666;
      font-style: italic;
      margin-bottom: 50px;
    }

    .team-members {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 40px;
      margin-bottom: 80px;
    }

    .member {
      width: 260px;
    }

    .member img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 50%;
    }

    .member h3 {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .member .role {
      color: #007bff;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .member .desc {
      font-size: 14px;
      color: #666;
      margin: 10px 0;
    }

    .social-icons {
      margin-top: 10px;
    }

    .social-icons a {
      color: #666;
      margin: 0 6px;
      font-size: 16px;
      text-decoration: none;
    }

    .credit {
      text-align: center;
      font-size: 12px;
      margin-top: 60px;
      color: #999;
    }

    .credit a {
      color: #666;
      text-decoration: underline;
    }

    body {
      background: linear-gradient(to bottom, rgb(17, 0, 0), #300000);
    }
  </style>
</head>
